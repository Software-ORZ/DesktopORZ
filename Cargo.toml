[package]
name = "desktoporz"
version = "0.10.0"
edition = "2021"
description = "DesktopORZ"
repository = "https://github.com/ThainanViniciusKatchan/DesktopORZ"
authors = ["ThainanViniciusKatchan"]
license = "MIT"
include = [
    "src/**/*",
    "build.rs",
    "langs/**/*",
    "Cargo.toml",
    "README.md",
]

[package.metadata.wix]
upgrade-guid = "E405F3A0-6765-432B-8499-19F92F144C70"
path-guid = "9B03144E-958B-4C89-8788-85FA839F7AB3"
license = false
eula = false

[[bin]]
name = "DesktopORZ"
path = "src/main.rs"

[[bin]]
name = "DesktopORZ-HideIcons"
path = "src/bin/hide_icons_daemon.rs"

[[bin]]
name = "DesktopORZ-GUI"
path = "src/bin/desktoporz_gui.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-pc-windows-msvc"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Whether to auto-include files like READMEs, LICENSEs, and CHANGELOGs (default true)
auto-includes = false
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["langs"]
# O wix/main.wxs é mantido à mão (a pasta langs entra no MSI), então o dist
# não deve regenerar esse template.
allow-dirty = ["msi"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
